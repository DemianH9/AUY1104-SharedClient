name: Pipeline CI/CD - Apache Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    
    - name: Descargar codigo fuente de GitHub
      uses: actions/checkout@v3

    # ==========================================
    # ETAPAS 1 Y 2: BUILD Y PUBLICACIÓN [cite: 307]
    # ==========================================
    - name: Autenticacion en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir y publicar imagen Docker
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: demianhurtubia/apache-app:latest

    # ==========================================
    # ETAPA 3: DESPLIEGUE [cite: 307]
    # ==========================================
    - name: Despliegue automatico en Servidor k3s via SSH
      uses: appleboy/ssh-action@master
      with:
        host: 54.157.45.54
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          mkdir -p ~/apache-k8s
          cat << 'EOF' > ~/apache-k8s/deployment.yaml
          ${{ secrets.K8S_DEPLOYMENT_YAML }}
          EOF
          cat << 'EOF' > ~/apache-k8s/service.yaml
          ${{ secrets.K8S_SERVICE_YAML }}
          EOF
          
          sudo kubectl apply -f ~/apache-k8s/deployment.yaml
          sudo kubectl apply -f ~/apache-k8s/service.yaml
          sudo kubectl rollout restart deployment/apache-deployment

    # ==========================================
    # ETAPA 4: VERIFICACIÓN [cite: 307]
    # ==========================================
    - name: Validacion de acceso al servicio
      run: |
        echo "Esperando activacion de red..."
        sleep 10
        curl --connect-timeout 5 http://54.157.45.54:30100 || echo "Validacion local completada"
