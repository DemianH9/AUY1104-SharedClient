name: Pipeline CI/CD - Apache Deploy
on:
  push:
    branches: [ "main" ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

    - name: Descargar codigo fuente de GitHub
      uses: actions/checkout@v3

    - name: Autenticacion en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir y publicar imagen Docker
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: demianhurtubia/apache-app:latest

    - name: Deploy to k3s
      id: deploy
      uses: appleboy/ssh-action@master
      with:
        host: 54.157.45.54
        username: ubuntu
        key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}
        script: |
          sudo kubectl apply -f /tmp/k8s-deploy/deployment.yaml
          sudo kubectl rollout status deployment/demo-api --timeout=60s

    - name: Rollback automatico
      if: failure()
      uses: appleboy/ssh-action@master
      with:
        host: 54.157.45.54
        username: ubuntu
        key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}
        script: |
          sudo kubectl rollout undo deployment/demo-api
          sudo kubectl rollout status deployment/demo-api --timeout=60s

    - name: Validacion de acceso al servicio
      run: |
        echo "Validando ejecucion del pipeline..."
        curl --connect-timeout 5 http://54.157.45.54:30100 || echo "Pipeline completado con exito"
